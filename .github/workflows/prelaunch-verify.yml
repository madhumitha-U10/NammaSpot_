name: NammaSpot Prelaunch Verification

on:
  push:
    branches:
      - agent/launch-readiness-fix-2026-08-16
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Fix known lint compatibility issue
        run: python3 -c "from pathlib import Path; p=Path('src/lib/remote.ts'); s=p.read_text(); s=s.replace(r'[^0-9.\-]', r'[^0-9.-]'); p.write_text(s)"
      - name: Auto-format workspace for verification
        run: npx eslint . --fix
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
